<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class="avatar"></div>
    <div class="follower"></div>
    <button class="start">start</button>
</body>
<script>
    const xhr = new XMLHttpRequest()
    const str = 'https://api.github.com/users/chiragb3005'
    xhr.open('GET', str)

    let pictureUrl
    let followers
    let data

    // xhr.onreadystatechange = function (){

    //         console.log(data.followers)
    //         console.log(data.avatar_url)
    //     }
    // }

    // xhr.send()



    document.querySelector('.start').addEventListener('click', (event) => {
        
        
    xhr.onreadystatechange = function (){
    console.log(xhr.readyState)
    if (xhr.readyState === 4){
            data = JSON.parse(this.responseText)
            console.log(typeof data)
            followers = data.followers
            pictureUrl = data.avatar_url
            document.querySelector('.avatar').innerHTML = `<img src="${pictureUrl}" width="150" />`
            document.querySelector('.follower').innerHTML = `followers count: ${followers}`
        }
    }
    
    xhr.send()

</script>
